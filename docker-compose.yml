# Runs the API in many containers with Nginx in front.
#   docker compose up --build --scale api=3
# Then open http://localhost:8080

services:
  api:
    build: .
    volumes:
      - ./models:/app/models   
      - ./data:/app/data      

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api